[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-telemetry"
version = "0.1.0"
description = "Live HDMI capture telemetry for Assetto Corsa on PS5 (Raspberry Pi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    # Plain uvicorn only: uvicorn[standard] pulls uvloop, which builds from
    # source on ARM and can hang for a long time on Pi 2B (Ctrl+C the build).
    "uvicorn>=0.32.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# x86 / Pi 5 only — pip OpenCV wheels often SIGILL on Pi 2B.
# On Pi 2B use: sudo apt install python3-opencv && venv --system-site-packages
capture = [
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
]
# Optional OCR for detect.lap_time.reader: tesseract (heavy on Pi 2B).
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
# Optional on x86 / faster hosts — do not install on Pi 2B (uvloop compile).
standard = [
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "httpx>=0.27.0",
]

[project.scripts]
ac-telemetry = "ac_telemetry.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ac_telemetry*"]

[tool.setuptools.package-data]
ac_telemetry = ["web/*"]
