# Default capture + detect config for AC telemetry.
# Override with AC_TELEMETRY_CONFIG or env vars (see Settings).
#
# pi2b: conservative caps for Raspberry Pi 2 Model B (USB 2.0, 1 GB RAM).
# pi5:  placeholder for the later upgrade path — not tuned yet.

profiles:
  pi2b:
    width: 1280
    height: 720
    fps: 10
    # Hard caps (enforced even if device reports higher)
    max_width: 1280
    max_height: 720
    max_fps: 15
  pi5:
    width: 1920
    height: 1080
    fps: 30
    max_width: 1920
    max_height: 1080
    max_fps: 60

# Active profile name (pi2b | pi5)
profile: pi2b

# Capture backend: v4l2 | mock
# Default is v4l2 for the Pi + HDMI dongle. Use mock on a laptop / CI:
#   ac-telemetry --backend mock
#   or AC_TELEMETRY_BACKEND=mock
backend: v4l2

# V4L2 device path (ignored by mock)
device: /dev/video0

# Prefer MJPEG FourCC on UVC devices (cheaper on USB2 / Pi 2B than raw YUYV).
prefer_mjpeg: true

# HTTP bind — 0.0.0.0 is LAN-friendly on the Pi; 127.0.0.1 is fine for local dev
host: "0.0.0.0"
port: 8741

# Where session + lap CSV files are written
data_dir: data/sessions

# Named HUD ROIs. Missing keys = that signal is disabled.
# Coordinates are for 1280x720; recalibrate on your capture.
# Point lap_time at the last-lap (completed) time display when mode is last_lap.
rois:
  # Scaled from acc-telemetry assetto_corsa_1080p.last_lap_time for pi2b 720p (×2/3).
  lap_time:
    x: 64
    y: 284
    width: 73
    height: 14

# Detection runs on a separate thread at a much lower FPS than capture.
detect:
  enabled: true
  fps: 2.0
  debounce_reads: 2
  drop_under_pressure: true
  lap_time:
    # mock: synthetic laps (no OCR). tesseract: optional OCR (heavy on Pi 2B).
    reader: tesseract
    mode: last_lap
    mock_interval_seconds: 45
    min_lap_ms: 30000
    reset_slack_ms: 5000
