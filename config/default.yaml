# Default capture + detect config for AC telemetry.
# Override with AC_TELEMETRY_CONFIG or env vars (see Settings).
#
# pi2b: conservative caps for Raspberry Pi 2 Model B (USB 2.0, 1 GB RAM).
# pi5:  placeholder for the later upgrade path — not tuned yet.

profiles:
  pi2b:
    width: 1280
    height: 720
    fps: 10
    # Hard caps (enforced even if device reports higher)
    max_width: 1280
    max_height: 720
    max_fps: 15
  pi5:
    width: 1920
    height: 1080
    fps: 30
    max_width: 1920
    max_height: 1080
    max_fps: 60

# Active profile name (pi2b | pi5)
profile: pi2b

# Capture backend: v4l2 | mock
# Default is v4l2 for the Pi + HDMI dongle. Use mock on a laptop / CI:
#   ac-telemetry --backend mock
#   or AC_TELEMETRY_BACKEND=mock
backend: v4l2

# V4L2 device path (ignored by mock)
device: /dev/video0

# Prefer MJPEG FourCC on UVC devices (cheaper on USB2 / Pi 2B than raw YUYV).
prefer_mjpeg: true

# HTTP bind — 0.0.0.0 is LAN-friendly on the Pi; 127.0.0.1 is fine for local dev
host: "0.0.0.0"
port: 8741

# Where session + lap CSV files are written
data_dir: data/sessions

# Where /debug "Save glyph" writes PNG crops from the live lap_time ROI.
# Same folder as detect.lap_time.templates_dir below. Live Pi set is incomplete
# (1/3/5 from dump); add more via Save glyph. Bundled ac_720p is ACC (wrong game).
glyphs_dir: templates/lap_time_digits/ac_720p_pi

# Named HUD ROIs. Missing keys = that signal is disabled.
# Coordinates are for 1280x720; recalibrate on your capture (see /debug).
# See docs/ROI.md for HUD key mapping from acc-telemetry.
rois:
  # Completed lap time HUD ("last lap"), not the running timer.
  # Calibrated from live PS5/Pi 2B 720p capture (HDMI + /debug ROI screenshot).
  # Used when detect.lap_time.mode is last_lap.
  lap_time:
    x: 92
    y: 287
    width: 84
    height: 17

# Detection runs on a separate thread at a much lower FPS than capture.
detect:
  enabled: true
  fps: 2.0
  debounce_reads: 2
  drop_under_pressure: true
  # Last-failure dump (ROI PNG + mask + score table) for /api/debug/detect/*.
  # Default: keep one failure slot in RAM; do not rewrite on every OK read.
  # Override: AC_TELEMETRY_DETECT_DEBUG_DUMP=0|1
  debug_dump:
    enabled: true
    on_success: false
    every_n_failures: 1
    include_full_frame: false
  lap_time:
    # Readers (pick one):
    #   mock      — synthetic laps (no pixels / OCR); good for laptop + plumbing tests
    #   tesseract — OCR; may fail on AC block font
    #   template  — OpenCV matchTemplate on digit PNGs (alias: assetto_corsa).
    #               Default for Pi 720p once Save glyph has filled templates_dir.
    reader: template
    mode: last_lap
    mock_interval_seconds: 45
    min_lap_ms: 30000
    reset_slack_ms: 5000
    # Same path as glyphs_dir — live Pi HDMI crops (incomplete; see set README).
    # Prefer over ac_720p_capture on soft MJPEG (lookalike 1↔7 / 3↔9 / 5↔6).
    # Bundled templates/lap_time_digits/ac_720p is ACC (mislabeled); do not use it.
    templates_dir: templates/lap_time_digits/ac_720p_pi
    match_threshold: 0.50
